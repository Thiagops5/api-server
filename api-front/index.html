<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Pessoas da API</h1>

  <p id="loading" style="display: none; color: blue; font-weight: bold;">⏳ Carregando...</p>
  <p id="error-msg" style="display: none; color: red; font-weight: bold;"></p>
  
  <form id="formulario">
    <div class="campo">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" placeholder="Digite o nome">
    </div>
    <div class="campo">
      <label for="idade">Idade:</label>
      <input type="number" id="idade" placeholder="Digite a idade">
    </div>
    <div class="campo">
      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Digite o email">
    </div>
    <button type="submit"  id="btn-submit">Adicionar Pessoa</button>
  </form>

  <div id="pessoas"></div>
<script src="script.js"></script>


</body>
</html>
